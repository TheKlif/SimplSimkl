<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimplSimkl</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p id="lastUpdated">Checking last updated time…</p>
  <div id="app">
    <button id="connectBtn" style="display:none;">Connect to Simkl</button>
    <p id="status"></p>

    <nav id="tabs">
      <button class="tab-btn active" data-tab="nextup">Next Up</button>
      <button class="tab-btn" data-tab="watching">Watching</button>
      <button class="tab-btn" data-tab="plantowatch">Plan to Watch</button>
      <button class="tab-btn" data-tab="completed">Watched</button>
      <button class="tab-btn" data-tab="search">Search</button>
    </nav>

    <div id="tabpanel-nextup" class="tab-panel">
      <div class="panel-header">
        <h2>Next Up</h2>
        <label class="sort-control">Sort: <select id="sort-nextup"></select></label>
      </div>
      <ul id="list-nextup"></ul>
    </div>

    <div id="tabpanel-watching" class="tab-panel" hidden>
      <div class="panel-header">
        <h2>Watching</h2>
        <label class="sort-control">Sort: <select id="sort-watching"></select></label>
      </div>
      <ul id="list-watching"></ul>
    </div>

    <div id="tabpanel-plantowatch" class="tab-panel" hidden>
      <div class="panel-header">
        <h2>Plan to Watch</h2>
        <label class="sort-control">Sort: <select id="sort-plantowatch"></select></label>
      </div>
      <ul id="list-plantowatch"></ul>
    </div>

    <div id="tabpanel-completed" class="tab-panel" hidden>
      <div class="panel-header">
        <h2>Watched</h2>
        <label class="sort-control">Sort: <select id="sort-completed"></select></label>
      </div>
      <ul id="list-completed"></ul>
    </div>

    <div id="tabpanel-search" class="tab-panel" hidden>
      <div class="panel-header">
        <h2>Search Simkl</h2>
      </div>
      <form id="search-form" class="search-form">
        <input type="text" id="search-input" placeholder="Search movies and TV shows" autocomplete="off">
        <button type="submit">Search</button>
      </form>
      <ul id="search-results"></ul>
    </div>
  </div>

  <div id="itemdetail-overlay" class="overlay" hidden>
    <div id="itemdetail" class="modal"></div>
  </div>
  <div id="episodedetail-overlay" class="overlay" hidden>
    <div id="episodedetail" class="modal"></div>
  </div>

  <script>
    function ready(fn) {
      if (document.readyState === "loading") {
        window.addEventListener("DOMContentLoaded", fn);
      } else {
        fn();
      }
    }

    (async () => {
      let versionTag = Date.now(); // fallback if the GitHub API call fails
      try {
        const res = await fetch("https://api.github.com/repos/TheKlif/SimplSimkl/commits?path=docs&per_page=1");
        const commits = await res.json();
        const commitDate = new Date(commits[0].commit.committer.date);
        document.getElementById("lastUpdated").textContent = `Last updated: ${commitDate.toLocaleString()}`;
        versionTag = commits[0].sha.slice(0, 7);
      } catch (err) {
        document.getElementById("lastUpdated").textContent = "Last updated: unknown (couldn't reach GitHub)";
      }

      const scripts = [
        "auth.js", "sortutils.js", "watchlist.js", "nextup.js",
        "search.js", "itemdetail.js", "tabs.js", "registersw.js"
      ];
      for (const src of scripts) {
        const el = document.createElement("script");
        el.src = `${src}?v=${versionTag}`;
        el.async = false; // dynamically created scripts default to async=true; this preserves load order
        document.body.appendChild(el);
      }
    })();
  </script>
</body>
</html>
